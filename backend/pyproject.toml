[project]
name = "ip-sakti-sahayak-backend"
version = "0.1.0"
description = "Source-cited IP and regulatory guidance for Ayurvedic products."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  # QR sign-in: locating and sampling the QR code in a camera frame.
  "opencv-python-headless>=4.9",
  "numpy>=1.26",
  # The reasoning rules in data/rules/*.yaml. Present transitively through
  # uvicorn[standard] today; declared here because the rules are not optional.
  "pyyaml>=6.0",
  # Document upload. multipart parses the form; pypdf pulls text out of a PDF.
  # Both are required rather than optional: an upload route that 500s because a
  # parser is missing is worse than one that is switched off, and the feature
  # flag is the thing that decides whether uploads exist.
  "python-multipart>=0.0.9",
  "pypdf>=5.0",
  # Member passwords: argon2id, a memory-hard KDF. Nothing in the stdlib does it.
  "argon2-cffi>=23.1",
  # Sign-in codes through Brevo's HTTPS API, where the host blocks SMTP.
  "httpx>=0.27",
  # A member's new password kept in Postgres, where the host's disk is wiped.
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
# The hosted-model client. Optional because the fixture generator answers over
# demo passages with nothing installed, and a machine that only needs to run the
# demo should not have to pull an SDK to do it.
llm = [
  "anthropic>=0.40",
]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
