# Everything `make lint`, `make test` and `make evals` do, plus the checks that
# only make sense against a build: the dependency audits and the bundle budget.
#
# The last job is the one that is easy to skip and expensive to skip: the repo
# must never name a competition, a ministry or a submission anywhere it ships.
# A grep is a poor substitute for judgement and a very good substitute for
# memory.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So the dependency audits notice a new advisory against code nobody has
  # touched. An audit that only runs on a push is an audit of the developer's
  # activity rather than of the dependency set.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e "backend[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Format
        run: python -m ruff format --check .
      - name: Tests
        run: python -m pytest
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Locale key sets are in sync
        run: node scripts/i18n-seed.ts --check
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Format
        run: npm run format:check
        working-directory: frontend
      - name: Types
        run: npm run typecheck
        working-directory: frontend
      - name: Tests
        run: npm test
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
      - name: Bundle budget
        run: npm run bundle
        working-directory: frontend

  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e "backend[dev]"
      # Exits non-zero when a metric with a target misses it, so jurisdiction
      # purity or authority purity dropping below 100% fails the build rather
      # than appearing in a report nobody opened.
      - name: Gold set
        run: python evals/score.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: evals/reports/

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip install -e "backend[dev,llm]"
          pip-audit --strict
      - name: Audit npm dependencies
        run: npm ci && npm audit --audit-level=high
        working-directory: frontend

  no-affiliation:
    # Nothing shipped may name a competition, a problem statement, a ministry as
    # endorser, or a team. This is checked rather than remembered because it is
    # the kind of thing that gets typed into a README at the last minute.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No competition, ministry or submission wording
        run: bash scripts/check-affiliation.sh
