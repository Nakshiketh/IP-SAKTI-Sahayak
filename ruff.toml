# Lints both /backend and /scripts. Run from the repo root.
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "node_modules", "dist"]

[lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[lint.per-file-ignores]
"backend/tests/*" = ["E501"]
# Document titles are data. Wrapping "The Geographical Indications of Goods
# (Registration and Protection) Act, 1999" across lines to satisfy a line length
# makes the source set harder to read and easier to typo.
"scripts/build_manifest.py" = ["E501"]
"scripts/build_records_manifest.py" = ["E501"]

[lint.isort]
known-first-party = ["app"]
